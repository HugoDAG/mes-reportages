name: Diag YouTube
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q -U yt-dlp requests
      - env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
        run: |
          printf '%s' "$YT_COOKIES" > /tmp/c.txt
          python3 - <<'PY'
          import subprocess, base64, json, requests, os
          def run(args):
              return subprocess.run(args, capture_output=True, text=True).stdout + subprocess.run(args, capture_output=True, text=True).stderr
          vid = subprocess.run(["yt-dlp","--cookies","/tmp/c.txt","--flat-playlist","--playlist-end","1","--print","id",
                                "--extractor-args","youtubetab:skip=authcheck",
                                "https://www.youtube.com/@BFM-Marseille/videos"], capture_output=True, text=True).stdout.strip()
          report = {"vid": vid, "clients": {}}
          for c in ["mweb","android","ios","web_safari","tv_embedded","default"]:
              out = subprocess.run(["yt-dlp","--cookies","/tmp/c.txt","--extractor-args",f"youtube:player_client={c}",
                                    "-F", f"https://www.youtube.com/watch?v={vid}"], capture_output=True, text=True)
              txt = (out.stdout + out.stderr)
              fmts = [l.split()[0] for l in out.stdout.splitlines() if l and l[0].isdigit()]
              err = next((l for l in txt.splitlines() if "ERROR" in l), "")
              report["clients"][c] = {"n_formats": len(fmts), "sample": fmts[:8], "err": err[:200]}
          repo="HugoDAG/mes-tournages-stockage"; H={"Authorization":f"Bearer {os.environ['STORAGE_TOKEN']}","Accept":"application/vnd.github+json"}
          url=f"https://api.github.com/repos/{repo}/contents/data/diag_formats.json"
          sha=requests.get(url,headers=H).json().get("sha")
          body={"message":"diag formats","content":base64.b64encode(json.dumps(report,indent=1).encode()).decode()}
          if sha: body["sha"]=sha
          print(requests.put(url,headers=H,json=body).status_code)
          PY
