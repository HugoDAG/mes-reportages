name: Diag Instagram
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q instaloader requests
      - env:
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
        run: |
          python3 - <<'PY'
          import instaloader, os, json, base64, requests
          rep={"accounts":{}}
          L=instaloader.Instaloader(download_pictures=False,download_videos=False,download_video_thumbnails=False,save_metadata=False,quiet=True,max_connection_attempts=2)
          L.context._session.cookies.set("sessionid",os.environ["IG_SESSIONID"],domain=".instagram.com")
          try:
              rep["logged_as"]=L.test_login()
          except Exception as e:
              rep["logged_as"]=f"err {e}"
          for acc in ["bfmtv","bfmmarseille"]:
              try:
                  p=instaloader.Profile.from_username(L.context,acc)
                  vids=[]
                  for i,post in enumerate(p.get_posts()):
                      if i>=6: break
                      if post.is_video: vids.append(post.shortcode)
                  rep["accounts"][acc]={"ok":True,"videos_sample":vids}
              except Exception as e:
                  rep["accounts"][acc]={"ok":False,"err":str(e)[:200]}
          repo="HugoDAG/mes-tournages-stockage"; H={"Authorization":f"Bearer {os.environ['STORAGE_TOKEN']}","Accept":"application/vnd.github+json"}
          url=f"https://api.github.com/repos/{repo}/contents/data/diag_ig.json"
          sha=requests.get(url,headers=H).json().get("sha")
          body={"message":"diag ig","content":base64.b64encode(json.dumps(rep,indent=1).encode()).decode()}
          if sha: body["sha"]=sha
          print(requests.put(url,headers=H,json=body).status_code)
          PY
