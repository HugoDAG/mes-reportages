name: Installation

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -q requests cryptography
      - name: Installer l'app
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          APP_EMAIL: ${{ secrets.APP_EMAIL }}
          APP_NAMES: ${{ secrets.APP_NAMES }}
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
          STORAGE_REPO: HugoDAG/mes-tournages-stockage
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: python setup/install.py
